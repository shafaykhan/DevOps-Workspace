services:
  todo-db:
    container_name: db
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
    ports:
      - "${DATABASE_PORT}:3306"
    networks:
      - todo-network
    volumes:
      - ./backend/src/main/resources/scripts/init_scripts.sql:/docker-entrypoint-initdb.d/init_scripts.sql
      - todo-volume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DATABASE_USER}", "-p${DATABASE_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  todo-backend:
    container_name: backend
    build: ./backend
    image: shafaykhan/todo-backend
    environment:
      ENV_VALUE: ${ENV_NAME}
      BACKEND_PORT: ${BACKEND_PORT}
      DATABASE_HOST: todo-db
      DATABASE_PORT: 3306
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    networks:
      - todo-network
    depends_on:
      todo-db:
        condition: service_healthy

networks:
  todo-network:
    driver: bridge

volumes:
  todo-volume:
    driver: local
